[project]
name = "mls-oer-pipeline"
version = "0.1.0"
description = "Offline ETL pipeline for the MLS Open Educational Resource Question Bank"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=18.0.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
